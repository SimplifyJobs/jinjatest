<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Coverage: {path}</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p><a href="index.html">&larr; Back to index</a></p>

    <h1>{path}</h1>

    <div class="summary {coverage_class}">
        <p>Coverage: <strong>{coverage_percent:.1f}%</strong>
           ({covered_branches}/{total_branches} branches)</p>
    </div>

    <h2>Uncovered Branches</h2>
    <ul class="branch-list">
        {uncovered_list}
    </ul>

    <h2>Source</h2>
    <table class="source-table">
        {source_lines}
    </table>
</body>
</html>
