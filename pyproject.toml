[project]
name = "jinjatest"
version = "0.2.0"
description = "A type-safe, structured testing library for Jinja templates"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kevin Castro <hola@kev.pe>" }]
keywords = ["jinja", "jinja2", "testing", "templates", "pytest", "json", "xml", "yaml", "markdown"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = [
    "jinja2>=3.1.3,<4.0.0",
    "pydantic>=2.12.0,<3.0.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0.1,<7.0.0"]
dev = [
    "pytest~=9.0.2",
    "pyyaml>=6.0.1,<7.0.0",
    "ruff~=0.14.13",
    "ty>=0.0.12",
]

[project.entry-points.pytest11]
jinjatest = "jinjatest.pytest_plugin"
jinjatest_cov = "jinjatest.coverage.pytest_cov"

[project.urls]
Homepage = "https://github.com/jinjatest/jinjatest"
Documentation = "https://github.com/jinjatest/jinjatest#readme"
Repository = "https://github.com/jinjatest/jinjatest"
Issues = "https://github.com/jinjatest/jinjatest/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jinjatest"]

[tool.ty.environment]
python-version = "3.10"

[[tool.ty.overrides]]
include = ["tests/"]

[tool.ty.overrides.rules]
# Tests frequently access attributes on union types after assertions narrow the type
possibly-missing-attribute = "ignore"
# Tests often use operators on optional types where context guarantees validity
unsupported-operator = "warn"
# Allow more flexible argument types in test code
invalid-argument-type = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]

[tool.coverage.run]
branch = true
source = ["jinjatest"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
